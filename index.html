<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of Galatine — AI Execution Control for Critical Infrastructure</title>
    <meta name="description" content="We validate AI actions before they execute in critical systems. MIG is the execution control layer between AI agents and the real world.">
    <meta property="og:title" content="House of Galatine — AI Execution Control for Critical Infrastructure">
    <meta property="og:description" content="We validate AI actions before they execute in critical systems. Nothing executes without approval.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://houseofgalatine.com">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050508;
            --bg-surface: #0a0a10;
            --bg-card: #0d0d16;
            --border: #1a1a28;
            --border-hover: #2a2a40;
            --allow: #00e88a;
            --deny: #ff3356;
            --approval: #f0b000;
            --text: #d4d4e0;
            --text-dim: #6a6a80;
            --text-muted: #3a3a50;
            --accent: #00e88a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(5,5,8,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .nav-brand {
            font-family: 'Instrument Serif', serif;
            font-size: 18px;
            color: var(--text);
            text-decoration: none;
        }
        .nav-brand span { color: var(--accent); }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }
        .nav-cta {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            padding: 8px 20px;
            background: rgba(0,232,138,0.08);
            border: 1px solid rgba(0,232,138,0.2);
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .nav-cta:hover {
            background: rgba(0,232,138,0.15);
            box-shadow: 0 0 20px rgba(0,232,138,0.1);
        }

        /* SECTIONS */
        .section { max-width: 1100px; margin: 0 auto; }
        .section-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .section-title {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 400;
            color: #f0f0f4;
            margin-bottom: 20px;
        }
        .section-desc {
            font-size: 16px;
            font-weight: 300;
            color: var(--text-dim);
            max-width: 620px;
            margin-bottom: 48px;
            line-height: 1.8;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 140px 40px 100px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero-label {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.2s forwards;
        }
        .hero h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(38px, 6vw, 72px);
            font-weight: 400;
            line-height: 1.1;
            color: #f0f0f4;
            margin-bottom: 28px;
            max-width: 900px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.4s forwards;
        }
        .hero h1 em { font-style: italic; color: var(--accent); }
        .hero-sub {
            font-size: 17px;
            font-weight: 300;
            color: var(--text-dim);
            max-width: 580px;
            line-height: 1.8;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.6s forwards;
        }
        .hero-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.8s forwards;
        }
        .btn-primary {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            padding: 14px 32px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0,232,138,0.2);
            transform: translateY(-1px);
        }
        .btn-ghost {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            padding: 14px 32px;
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

        /* TAGLINE */
        .tagline-bar {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 28px 40px;
            text-align: center;
            background: var(--bg-surface);
        }
        .tagline-bar p {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            font-style: italic;
            color: var(--text-dim);
        }
        .tagline-bar p span { color: var(--accent); }

        /* ABOUT COMPANY */
        .about-co { padding: 120px 40px; }
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            margin-top: 48px;
        }
        .about-text p {
            font-size: 15px;
            font-weight: 300;
            color: var(--text-dim);
            line-height: 1.9;
            margin-bottom: 20px;
        }
        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            margin-top: 24px;
        }
        .stat-item {
            background: var(--bg);
            padding: 24px;
        }
        .stat-num {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* WHAT WE DO */
        .what-we-do {
            padding: 120px 40px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .two-arms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 48px;
        }
        .arm-card {
            padding: 48px 36px;
            background: var(--bg);
            border: 1px solid var(--border);
            position: relative;
        }
        .arm-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
        }
        .arm-card.services::before { background: #60a5fa; }
        .arm-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .arm-card .arm-label { color: var(--accent); }
        .arm-card.services .arm-label { color: #60a5fa; }
        .arm-card h3 {
            font-family: 'Instrument Serif', serif;
            font-size: 24px;
            color: #f0f0f4;
            font-weight: 400;
            margin-bottom: 16px;
        }
        .arm-card p {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .arm-card ul {
            list-style: none;
            margin-top: 16px;
        }
        .arm-card ul li {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .arm-card ul li::before {
            content: '→ ';
            color: var(--accent);
        }
        .arm-card.services ul li::before { color: #60a5fa; }

        /* PROBLEM */
        .problem { padding: 120px 40px; }
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }
        .problem-item { background: var(--bg); padding: 40px 32px; }
        .problem-item h3 {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--deny);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .problem-item p { font-size: 14px; color: var(--text-dim); font-weight: 300; line-height: 1.7; }

        /* HOW MIG WORKS */
        .how { padding: 120px 40px; }
        .pipeline-visual {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 48px;
            margin-bottom: 48px;
        }
        .pipe-step {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pipe-box {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            padding: 10px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--accent);
            letter-spacing: 0.05em;
        }
        .pipe-arrow { color: var(--text-muted); font-size: 14px; }

        .outcomes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 36px;
        }
        .outcome-card {
            padding: 36px 28px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            position: relative;
        }
        .outcome-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
        }
        .outcome-card.allow::before { background: var(--allow); }
        .outcome-card.approval::before { background: var(--approval); }
        .outcome-card.deny::before { background: var(--deny); }
        .outcome-card h3 {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
        }
        .outcome-card.allow h3 { color: var(--allow); }
        .outcome-card.approval h3 { color: var(--approval); }
        .outcome-card.deny h3 { color: var(--deny); }
        .outcome-card p { font-size: 13px; color: var(--text-dim); font-weight: 300; line-height: 1.7; }

        /* LIVE PROOF */
        .proof {
            padding: 120px 40px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .proof-examples {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 48px;
        }
        .proof-row {
            display: grid;
            grid-template-columns: 1fr 120px 100px;
            gap: 16px;
            padding: 18px 24px;
            background: var(--bg);
            border: 1px solid var(--border);
            align-items: center;
        }
        .proof-input {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--text);
        }
        .proof-badge {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            text-align: center;
        }
        .proof-badge.allow { color: var(--allow); background: rgba(0,232,138,0.08); border: 1px solid rgba(0,232,138,0.15); }
        .proof-badge.deny { color: var(--deny); background: rgba(255,51,86,0.08); border: 1px solid rgba(255,51,86,0.15); }
        .proof-badge.approval { color: var(--approval); background: rgba(240,176,0,0.08); border: 1px solid rgba(240,176,0,0.15); }
        .proof-score {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }
        .proof-context {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 300;
            margin-top: 8px;
            max-width: 700px;
        }

        /* COMPARED */
        .compared { padding: 120px 40px; }
        .compare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 48px;
            font-size: 13px;
        }
        .compare-table th {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            text-align: left;
            padding: 16px 20px;
            border-bottom: 2px solid var(--accent);
            background: var(--bg-surface);
        }
        .compare-table td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
            font-weight: 300;
        }
        .compare-table tr:hover td { background: var(--bg-surface); }
        .compare-table td:first-child {
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            color: var(--text);
        }

        /* FOUNDER */
        .founder {
            padding: 120px 40px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .founder-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 64px;
            margin-top: 48px;
        }
        .founder-info h3 {
            font-family: 'Instrument Serif', serif;
            font-size: 28px;
            color: #f0f0f4;
            font-weight: 400;
            margin-bottom: 8px;
        }
        .founder-role {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .founder-bio p {
            font-size: 15px;
            font-weight: 300;
            color: var(--text-dim);
            line-height: 1.9;
            margin-bottom: 16px;
        }
        .founder-creds {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cred-item {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .cred-item span { color: var(--accent); margin-right: 8px; }

        /* CTA */
        .cta {
            padding: 140px 40px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .cta h2 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 400;
            color: #f0f0f4;
            margin-bottom: 20px;
        }
        .cta p {
            font-size: 16px;
            color: var(--text-dim);
            font-weight: 300;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .cta-email {
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            color: var(--accent);
            text-decoration: none;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(0,232,138,0.3);
            transition: all 0.3s;
        }
        .cta-email:hover { border-bottom-color: var(--accent); }
        .cta-links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .cta-links a {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .cta-links a:hover { color: var(--text-dim); border-color: var(--border-hover); }

        /* FOOTER */
        footer {
            padding: 32px 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-brand { font-family: 'Instrument Serif', serif; font-size: 14px; color: var(--text-muted); }
        .footer-right { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; }

        /* ANIMATIONS */
        @keyframes fade
